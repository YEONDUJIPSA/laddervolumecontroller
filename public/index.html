<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Volume Control Interface</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Volume Control Interface</h1>
        <p>Choose two nodes. 🔴 First one is Tens, 🔵 Second one is Units.</p>

        <div id="top-labels"></div>

        <div id="ladder-board"></div>

        <div id="bottom-labels"></div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="setupGame()">Ladder reset</button>
        </div>

        <div class="result-container">
            <h2>Result</h2>
            <div id="results-display">Choose another nodes</div>
        </div>
        
        <div id="spinner"></div> 
    </div>

    <script src="script.js"></script>
</body>
</html>
